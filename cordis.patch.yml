# WebGate bundle patch：把本包的 Host 插件行插入 web profile。
#
# 通过官方 CLI 安装时（dsh plugin --profile web add github:yyyq0325-ai/dsh-webgate），
# 安装命令会依据 package.json 的 dsh.bundle.patch 声明自动合并本补丁；
# 也可以手动把下面的 insert 行复制进 profile 的 cordis.patch.yml。
#
# 注意：npm 注册表上的 `dsh-webgate` 是另一个无关包（远程访问工具，作者 pppolf），
# 因此本包使用带 scope 的名字 @yyyq0325-ai/dsh-webgate，安装时请勿省略 scope。
#
# 可选配置：无。所有行为开箱即用，初始管理员账号见 README。
- insert:
    - id: webgate
      name: '@yyyq0325-ai/dsh-webgate'
