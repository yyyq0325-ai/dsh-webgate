# =============================================================================
# WebGate 反代方案 A —— nginx Basic Auth + 反向代理（备选；无域名/无证书可用）
# =============================================================================
# ⚠️ 备选方案：推荐优先使用同目录的 auth-request.conf（方案 B）——
#    它复用 WebGate 账号体系：加账号就是 /useradd，完全不需要本文件的
#    口令文件，也没有下面的第 2 步。本方案适合想要「无状态总闸」的场景。
#
# 🛡 对「伪造 Host 头绕过信任围栏」类漏洞的防御：
#   这类漏洞要求攻击者能与 dsh 端口直接对话（构造 Host: 127.0.0.1 冒充
#   回环受信来源）。反代架构下攻击者只能面对 nginx——未过鉴权的请求在
#   到达 dsh 之前就被 401 掉了；nginx 向上游转发固定 Host（见下方
#   proxy_set_header），客户端伪造的头在上游视角毫无意义。
#
# ── 使用步骤（一次性动作；不是每个账号都做一遍！）────────────────
#   1. 把两处 server_name 改成服务器 IP（或随便一个名字，纯 IP 访问时
#      它不参与实际匹配）
#   2. 生成口令文件 —— 它是「大门钥匙」，通常只建一个共享账号即可，
#      门内的多用户由 WebGate 的 /useradd 管理，与此文件无关：
#
#        Linux:              sudo htpasswd -cB /etc/nginx/dsh.htpasswd alice
#        Windows (Git Bash): printf "alice:$(openssl passwd -apr1 '你的密码')" \
//                              > /c/nginx/conf/dsh.htpasswd
#        Windows (Docker):   docker run --rm httpd:alpine htpasswd -nb alice '你的密码' \
//                              > C:\nginx\conf\dsh.htpasswd
#
#      之后想加大门账号：向同一文件追加行（去掉 -c），不加也完全可以。
#   3. 复制本文件到 conf.d 目录，nginx -t 通过后 reload。
#
# ⚠️ 明文 HTTP 下，Basic Auth 口令只是 base64 编码、可被还原——仅建议在
#    可信局域网内使用。要出公网请启用文末注释的 HTTPS 块：
#      · 有域名：certbot 免费签发 Let's Encrypt 证书
#      · 无域名：Cloudflare Tunnel 边缘自带 TLS，源站可用自签证书
#
# 前置硬性要求：dsh 保持默认绑定 127.0.0.1:3080 —— 永远不要改成
# 0.0.0.0，也不要对局域网/公网放行 3080 端口（否则攻击者绕过 nginx 直连上游，
# 伪造 Host 头绕过信任围栏类漏洞即可能被利用）。
# =============================================================================

# WebSocket 升级映射（http 级别指令；conf.d 目录下即可生效）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── 默认形态：纯 HTTP，无域名 / 无证书直接可用 ──────────────────────
# 监听端口按需调整（如 80 被占用可改 8080，访问地址即 http://<IP>:8080）
server {
    listen 80;
    server_name _;                               # 纯 IP 访问时无需真实域名

    # ── 第一道门：服务端强制，绕不过去 ─────────────────────────────
    auth_basic           "DeepSeek Harness";
    auth_basic_user_file /etc/nginx/dsh.htpasswd;   # ← Windows 改成你的实际路径

    # 被 401 的请求延迟应答，抬高爆破成本（nginx ≥ 1.21.1）
    auth_delay 2s;

    # 附件上传按需调大
    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;

        # WebSocket（DSH 的 /api 有 upgrade 通道）
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 固定转发 Host 为 dsh 的监听地址：既满足其回环信任围栏（功能完整），
        # 又让客户端伪造的 Host 头在上游视角毫无意义 —— 信任边界在 nginx。
        proxy_set_header Host 127.0.0.1:3080;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE / 流式输出：必须关缓冲、拉长超时，否则回复会"卡住不动"
        proxy_buffering off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

