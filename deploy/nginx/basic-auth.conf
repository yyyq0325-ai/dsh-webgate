# =============================================================================
# WebGate 反代方案 A —— nginx Basic Auth + 全站反向代理
# =============================================================================
# 适用：把 DSH Web 通过内网穿透（cloudflared/frp）或服务器部署暴露出去，
# 需要一道「服务端强制、绕不过去」的门。Basic Auth 在请求到达 dsh 之前
# 由 nginx 校验，静态资源 / /api / WebSocket 全部被保护。
#
# 与插件的关系：双层门。nginx 口令管"能不能进门"，WebGate 账号体系管
# "进门后是谁、能看哪些工作区"。两层账号可以不同。
#
# 前置要求：
#   1. dsh 保持默认绑定 127.0.0.1:3080 —— 永远不要改成 0.0.0.0
#   2. 生成口令文件：  sudo htpasswd -cB /etc/nginx/dsh.htpasswd alice
#      （-B 为 bcrypt；追加用户去掉 -c）
#   3. TLS 证书：服务器部署用 certbot；cloudflared 隧道可用 Cloudflare
#      源站证书，并在隧道 ingress 里指向 https://localhost:443
#      （originRequest.noTLSVerify: true）
#
# 安装：复制到 /etc/nginx/conf.d/dsh.conf，nginx -t 通过后 reload。
# =============================================================================

# WebSocket 升级映射（http 级别指令；conf.d 目录下即可生效）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    http2 on;
    server_name dsh.example.com;                 # ← 改成你的域名

    ssl_certificate     /etc/letsencrypt/live/dsh.example.com/fullchain.pem;   # ← 改成你的证书路径
    ssl_certificate_key /etc/letsencrypt/live/dsh.example.com/privkey.pem;     # ← 改成你的私钥路径
    server_tokens off;

    # ── 第一道门：服务端强制，绕不过去 ─────────────────────────────
    auth_basic           "DeepSeek Harness";
    auth_basic_user_file /etc/nginx/dsh.htpasswd;

    # 被 401 的请求延迟应答，抬高爆破成本（nginx ≥ 1.21.1）
    auth_delay 2s;

    # 附件上传按需调大
    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;

        # WebSocket（DSH 的 /api 有 upgrade 通道）
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE / 流式输出：必须关缓冲、拉长超时，否则回复会"卡住不动"
        proxy_buffering off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# HTTP 全部跳转 HTTPS
server {
    listen 80;
    server_name dsh.example.com;                 # ← 与上面保持一致
    return 301 https://$host$request_uri;
}
