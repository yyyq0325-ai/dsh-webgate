# =============================================================================
# WebGate 反代方案 B —— nginx auth_request 对接 WebGate 会话
# =============================================================================
# 体验：只有 WebGate 一层登录（无 Basic Auth 浏览器弹窗），但校验发生在
# 服务端——未登录访问任何受保护路径，nginx 直接 302 到 /login。
#
# 原理：登录成功时插件会种下 webgate_token Cookie；nginx 对每个受保护
# 请求发起子请求 GET /auth/api/verify，插件读取 Cookie 校验会话，
# 返回 204（放行）或 401（跳转登录）。
#
# 版本要求：WebGate 插件 ≥ 0.2.2（提供 /auth/api/verify 端点）。
#
# 注意：
#   * WebGate 会话保存在 dsh 进程内存中 —— dsh 重启后所有会话失效，
#     所有人重新走一遍 /login 即可，属预期行为；
#   * 该端点只读不写、无副作用；如需抵御会话爆破可叠加
#     auth_delay 与 limit_req（见 basic-auth.conf 注释）。
#
# 本模板默认「纯 HTTP 局域网」形态：没有域名、没有证书也能直接用；
# 有域名 + 证书后参考文末注释块切换 HTTPS。口令文件等安装细节见
# basic-auth.conf 头部说明（本方案不需要 htpasswd，那一段可跳过）。
# =============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── 默认形态：纯 HTTP，无域名 / 无证书直接可用 ──────────────────────
server {
    listen 80;
    server_name _;                               # 纯 IP 访问时无需真实域名

    # ── 服务端会话校验：所有未显式放行的路径都要过这道闸 ──────────
    auth_request /_webgate_verify;
    error_page   401 = @to_login;

    # 子请求：把浏览器的 Cookie 带给插件的 verify 端点
    location = /_webgate_verify {
        internal;
        proxy_pass http://127.0.0.1:3080/auth/api/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;   # 默认会透传，显式写出更清晰
    }

    # ── WebSocket events 通道 ────────────────────────────────────────
    # 这类握手走 HTTP Upgrade，一旦被 auth_request 拦截就会 302 → 登录页
    # HTML，握手失败（浏览器报 "WebSocket is closed before…"）。页面外壳
    # 本身已通过鉴权才渲染出来，WS 只是同一会话的延伸，故对这两条 events
    # 路径跳过 auth_request；连接建立后数据仍走已鉴权的 fetch 通道。
    #（其余 /api 路径仍受 auth_request 保护。）
    location ~ ^/api/events\.(mux|host)$ {
        auth_request off;

        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host 127.0.0.1:3080;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 未登录 → 跳登录页并记住原地址（WebGate 登录后经 next 回跳）
    location @to_login {
        return 302 /login?next=$request_uri;
    }

    # ── 公开区：登录页与认证 API 本身不受 auth_request 保护 ────────
    # （否则未登录用户连 /login 都打不开，造成重定向死循环）
    location ~ ^(/login|/auth/page|/auth/api/) {
        auth_request off;

        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        # 固定 Host：满足 dsh 回环信任围栏，客户端伪造的 Host 无意义
        proxy_set_header Host 127.0.0.1:3080;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;                    # /auth/api 无流式响应也无妨
        proxy_read_timeout 3600s;
    }

    # ── 受保护区：页面外壳、静态资源、/api 数据通道、WebSocket ─────
    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # 固定 Host：满足 dsh 回环信任围栏的第一重检查（Host 为回环）。
        proxy_set_header Host 127.0.0.1:3080;
        # 置空并丢弃 Origin：dsh 围栏还有两重检查——「Sec-Fetch-Site 非
        # cross-site」且「Origin.host === Host」。浏览器经域名访问时 Origin
        # 是 http://www.dsh.local，与转发的回环 Host 不相等，所有 /api RPC
        # 会被 403 拒绝（表现为列表为空、无法新建工作区）。鉴权已在 nginx
        # 层完成，这里丢弃 Origin 即可恢复功能且不降低安全性——跨站请求仍
        # 会被 Sec-Fetch-Site 检查与 nginx 鉴权双重拦截。
        proxy_set_header Origin "";
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;                    # SSE / 流式输出必须关闭缓冲
        proxy_cache        off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

